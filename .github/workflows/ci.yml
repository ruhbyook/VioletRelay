name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-build-isolation --no-deps
      - name: Unit and synthetic media integration tests
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m coverage run -m pytest -W error
          python -m coverage report
      - name: Audit locked Python dependencies
        shell: pwsh
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --progress-spinner off
      - name: Acquire verified FFmpeg integration tools
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -SkipPython
      - name: Validate synthetic media pipeline
        shell: pwsh
        run: |
          .\scripts\generate_test_fixtures.ps1
          python .\scripts\validate_media_pipeline.py

  portable-build:
    runs-on: windows-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.lock
          .venv\Scripts\python.exe -m pip install -e . --no-build-isolation --no-deps
      - name: Build public-style portable package
        shell: pwsh
        run: .\scripts\build.ps1 -WithoutBundledFFmpeg -DistRoot dist-ci
      - name: Smoke test packaged application
        shell: pwsh
        run: .\scripts\verify_package.ps1 -DistRoot dist-ci -Smoke
      - uses: actions/upload-artifact@v7
        with:
          name: VioletRelay-windows-x64-unsigned
          path: dist-ci/VioletRelay
          if-no-files-found: error
          retention-days: 7
