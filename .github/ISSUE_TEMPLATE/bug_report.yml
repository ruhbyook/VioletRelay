name: Bug report
description: Report a reproducible playback, casting, or interface problem
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ReelFerry. Do not attach copyrighted media, pairing files, raw network captures, or unreviewed diagnostic logs.
  - type: input
    id: version
    attributes:
      label: ReelFerry version
      placeholder: "0.5.2"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: apple-tv
    attributes:
      label: Apple TV and tvOS version
      description: Enter "not applicable" for local-playback problems.
      placeholder: "Apple TV 4K, tvOS 26.5"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: "NVIDIA RTX 3080, driver 5xx.xx"
  - type: dropdown
    id: media
    attributes:
      label: Media source
      options:
        - Local file without subtitles
        - Local file with embedded subtitles
        - Local file with external subtitles
        - Direct HTTP/HTTPS media URL
        - Direct HLS URL
        - Audio file
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Review text before posting. Remove names, local paths, URLs, IP addresses, and anything private.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I tested the latest published beta.
          required: true
        - label: I did not attach media, credentials, pairing data, or an unreviewed capture.
          required: true
