[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "violetrelay"
version = "0.6.3"
description = "A cinematic Windows media player with optional Apple TV casting"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
  "airplay",
  "airplay2",
  "apple-tv",
  "casting",
  "ffmpeg",
  "free-media-player",
  "mkv",
  "open-source",
  "subtitles",
  "video-player",
  "windows",
]
dependencies = [
  "platformdirs==4.11.0",
  "pyatv==0.18.0",
  "PySide6>=6.9,<6.12",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/ruhbyook/VioletRelay"
Documentation = "https://github.com/ruhbyook/VioletRelay#readme"
Issues = "https://github.com/ruhbyook/VioletRelay/issues"
Source = "https://github.com/ruhbyook/VioletRelay"

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.8",
  "Pillow>=11.1,<13",
  "pyinstaller>=6.14",
  "pytest>=8.4",
  "pytest-qt>=4.4",
  "qrcode>=8.2,<9",
]

[project.scripts]
violetrelay = "violetrelay.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/violetrelay"]

[tool.hatch.build.targets.wheel.force-include]
"src/violetrelay/qml" = "violetrelay/qml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["violetrelay"]
omit = ["*/qml/*"]
